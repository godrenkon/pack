<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#111827" />
    <title>White Room Button</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game" aria-label="White Room Button game"></canvas>
      <section id="hud" aria-live="polite">
        <p id="score-label">SCORE</p>
        <p id="score">0</p>
        <p id="status">赤いボタンまで歩こう</p>
      </section>
      <button id="push" type="button" disabled>PUSH</button>
      <button id="reset" type="button" aria-label="ゲームを最初からやり直す">↺</button>
      <div id="joystick" aria-label="移動スティック">
        <div id="joystick-knob"></div>
      </div>
      <div id="look-hint">右側をなぞって視点を動かす</div>
      <div id="start-screen">
        <h1>WHITE ROOM</h1>
        <p>白い部屋を歩いて、中央の赤いボタンを押せ。</p>
        <button id="start" type="button">START</button>
        <small>PC: WASD / 矢印キー + ドラッグ</small>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
