name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Copy web game into Android assets
        run: mkdir -p android/app/src/main/assets/www && cp -R www/. android/app/src/main/assets/www/
      - name: Build debug APK
        run: cd android && gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: White-Room-Button-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
