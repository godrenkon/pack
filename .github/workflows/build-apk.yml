name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Copy web game into Android assets
        run: mkdir -p android/app/src/main/assets/www && cp -R www/. android/app/src/main/assets/www/
      - name: Set increasing Android version
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
      - name: Build debug APK
        run: cd android && gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: White-Room-Button-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.1
          APK: android/app/build/outputs/apk/debug/app-debug.apk
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "White Room Button v0.1.1" \
              --notes "白い3D部屋を歩いて中央の赤いボタンを押すスマホ向け試作ゲーム。テスト用debug APKです。"
          else
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          fi
